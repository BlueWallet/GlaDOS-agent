name: Notifications

on:
  schedule:
    # Every 15 minutes, offset from :00/:15/:30/:45 to avoid worker contention
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

concurrency:
  group: notifications
  # Never kill a review mid-flight: a cancelled run throws away all its tokens and
  # the next run starts the same PR from scratch. GitHub keeps at most one pending
  # run per group, so queued wake-ups still collapse.
  cancel-in-progress: false

jobs:
  notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Review pending PRs
        env:
          GLADOS_TOKEN: ${{ secrets.GLADOS_TOKEN }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: npm run notifications
